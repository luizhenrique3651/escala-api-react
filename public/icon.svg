<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo -->
  <rect width="100" height="100" fill="#3b82f6"/>

  <!-- Livro aberto -->
  <path d="M20 30 L50 25 L80 30 L80 75 Q80 80 75 80 L50 82 L25 80 Q20 80 20 75 Z" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>

  <!-- Espinha do livro (divisão central) -->
  <line x1="50" y1="25" x2="50" y2="82" stroke="#1f2937" stroke-width="2"/>

  <!-- Linhas de páginas esquerda -->
  <line x1="28" y1="40" x2="46" y2="38" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="26" y1="50" x2="46" y2="48" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="27" y1="60" x2="46" y2="59" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="28" y1="70" x2="46" y2="70" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Linhas de páginas direita -->
  <line x1="54" y1="38" x2="72" y2="40" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="54" y1="48" x2="74" y2="50" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="54" y1="59" x2="73" y2="60" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="54" y1="70" x2="72" y2="70" stroke="#d1d5db" stroke-width="1.5"/>
</svg>

